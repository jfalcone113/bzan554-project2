[project]
name = "incremental-pricing-assignment"
version = "0.1.0"
description = "Bounded-memory TensorFlow regression and assignment presentation"
requires-python = ">=3.12,<3.13"
dependencies = [
  "tensorflow-cpu==2.20.0; sys_platform == 'linux'",
  "tensorflow==2.20.0; sys_platform != 'linux'",
  "numpy>=2.1,<2.3",
  "pandas==2.3.3",
  "matplotlib==3.10.8",
  "psutil==7.2.2",
  "reportlab==4.4.10",
]

